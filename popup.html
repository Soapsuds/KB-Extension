<!doctype html>
<html>

<head>
    <style>
        body {
            width: 150px;
            padding: 10px;
            font-family: sans-serif;
        }

        button {
            width: 100%;
            cursor: pointer;
            padding: 8px;
        }

        .on {
            background-color: #4caf50;
            color: white;
        }

        .off {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>Shipping Tools</h3>
        <button id="copyBtn"
            style="background-color: #2196F3; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%;">
            Copy Names List
        </button>
        <p id="statusMsg" style="font-size: 12px; color: #666; text-align: center; margin-top: 8px;"></p>
    </div>
    <button id="toggleBtn">Loading...</button>
    <script src="popup.js"></script>
</body>

</html>
